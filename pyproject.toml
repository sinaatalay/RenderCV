[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project]
name = "rendercv"
version = "2.9"
description = "Resume builder for academics and engineers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sina Atalay", email = "dev@atalay.biz" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Printing",
  "Topic :: Text Processing :: Markup",
]  # See all classifiers at https://pypi.org/classifiers/
dependencies = [
  "Jinja2>=3.1.6",  # Generate Typst and Markdown files
  "markdown-it-py>=4.2.0",  # Parse Markdown content and convert Markdown to HTML
  "phonenumbers>=9.0.41",  # Validate phone numbers
  "pydantic-extra-types>=2.11.1",  # Validate extra types
  "pydantic[email]>=2.14.1",  # Validate and parse input files
  "ruamel.yaml>=0.19.1",  # Parse YAML files
]

[project.optional-dependencies]
full = [
  "typer>=0.27.3",  # Command-line interface
  "watchdog>=6.0.0",  # Monitor files for updates
  "typst>=0.15.0",  # Render PDF from Typst source files
  "rendercv-fonts>=0.6.0",  # Font files for RenderCV
  "packaging>=26.3",  # For version checking
]

[project.urls]
Changelog = "https://docs.rendercv.com/changelog"
Documentation = "https://docs.rendercv.com"
Source = "https://github.com/rendercv/rendercv"
"Web App" = "https://rendercv.com"

[project.scripts]
rendercv = "rendercv.cli.entry_point:entry_point"

[dependency-groups]
dev = [
  "codespell>=2.4.3",  # Check spelling
  "fonttools>=4.67.0",  # Verify bundled font versions and glyph coverage
  "hypothesis>=6.170.5",  # Property-based testing
  "jsonschema>=4.26.0",  # Validate generated editor schemas
  "prek>=0.5.7",  # Run checks before committing (pre-commit alternative)
  "pytest>=9.1.1",  # Run tests
  "pytest-cov>=7.1.0",  # Coverage plugin for pytest with xdist support
  "pytest-xdist>=3.8.0",  # Run tests in parallel
  "ruff>=0.17.1",  # Lint and format the code
  "ty>=0.0.90",  # Type checking
]
create-executable = [
  "pyinstaller>=6.22.3",  # Build executables
]
docs = [
  "markdown-callouts>=0.4.0",  # GitHub alert style admonitions
  "mkdocstrings-python>=2.0.10",  # Build reference docs from docstrings
  "zensical>=0.0.71",  # Build the documentation site
]


[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.sources]
rendercv-fonts = { workspace = true }

[tool.uv.build-backend]
# The bundled Typst packages are src/rendercv/renderer/rendercv_typst/ and the ones
# that scripts/download_typst_packages.py downloads into
# src/rendercv/renderer/typst_packages/. Only their typst.toml and lib*.typ files (and
# the third-party licenses) are needed at runtime; exclude everything else from the wheel.
wheel-exclude = [
    "renderer/rendercv_typst/examples/**",
    "renderer/rendercv_typst/template/**",
    "renderer/rendercv_typst/README.md",
    "renderer/rendercv_typst/CHANGELOG.md",
    "renderer/rendercv_typst/LICENSE",
    "renderer/rendercv_typst/thumbnail.png",
    "renderer/typst_packages/**/README.md",
]

[tool.uv.workspace]
members = [
    "packages/rendercv-fonts",
    "scripts/ats_proof",
]

[tool.ruff]
line-length = 88
# Code blocks in Markdown are examples and templates (`{{ variable }}` isn't Python):
extend-exclude = ["*.md"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
  "E501",  # Lines too long, which the formatter doesn't split in strings
  "B",
  "I",
  "ARG",
  "C4",
  "EM",
  "ICN",
  "ISC",
  "G",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "T20",
  "UP",
  "YTT",
  "EXE",
  "NPY",
  "PD",
]
ignore = [
  "PLR",  # Design-related pylint codes
  "ISC001",  # Conflicts with formatter
  "UP007",  # Allow Optional type
  "PGH003",  # Prefer not to ignore this
  "RUF001",  # Allow other characters for locale
  "EM101",  # Allow
]
flake8-unused-arguments.ignore-variadic-names = true

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.coverage.run]
source = ["src/rendercv", "packages/rendercv-fonts/src/rendercv_fonts"]
concurrency = ["multiprocessing"]  # For watcher tests
# Use relative paths for cross-platform coverage merging:
relative_files = true

[tool.coverage.report]
# Exclude templates from coverage reports:
omit = ["*.j2.*"]

# tombi: lint.rules.deprecated.disabled = true
# tombi: lint.rules.one-of-multiple-match.disabled = true
[tool.pytest.ini_options]
log_cli_level = "INFO"
xfail_strict = true
addopts = [
  "-ra",  # Show extra test summary info
  "-v",  # Increase verbosity
  "--strict-markers",  # Disallow unknown markers
  "--strict-config",  # Fail on unknown config options
  "--numprocesses=auto",  # Number of processes in parallel
]
testpaths = ["tests"]

[tool.codespell]
skip = "*.md,*.pdf,*.png,*.otf,*.ttf,schema.json,*/other_locales/*"
