# Render blueprint for the web editor.
#
# Render reads this on "New > Blueprint" and creates both the service and
# its database. Everything here is declarative except the two Google
# secrets, which are marked `sync: false` so Render prompts for them
# instead of this file carrying them into a public repository.
#
# The image is `web/Dockerfile`, built from the repository root -- the
# backend depends on the core as an editable path dependency and needs its
# source tree, so the context cannot be `web/`.

services:
  - type: web
    name: rendercv-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/themes
    envVars:
      # Signs the session cookie. Generated by Render rather than set here:
      # the fallback in the code is a string checked into this public
      # repository, so anyone could forge a validly signed cookie and read
      # other people's CVs. The server only warns about that -- it does not
      # refuse to start.
      - key: RENDERCV_WEB_SECRET
        generateValue: true

      # Marks the session cookie `Secure`, which Render's HTTPS makes
      # correct. Without it the cookie would also be sent over plain HTTP.
      - key: RENDERCV_WEB_HTTPS
        value: "1"

      # SQLite in a container is lost on every restart, taking every user's
      # CVs with it, so the database is a real one.
      - key: RENDERCV_WEB_DATABASE_URL
        fromDatabase:
          name: rendercv-web-db
          property: connectionString

      # From Google Cloud Console. Render asks for these at deploy time.
      # Until they are set, `/app` says sign-in is not configured and the
      # editor cannot be entered -- the landing page still works.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

      # Must match an Authorized redirect URI on the OAuth client exactly.
      # Fill in the service's real hostname once Render has assigned it:
      #     https://<service>.onrender.com/api/auth/google/callback
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false

      # `RENDERCV_WEB_ALLOWED_ORIGINS` is deliberately absent. The frontend
      # and the API are the same origin here, so there is no cross-origin
      # request to allow -- see the CORS note in `web/README.md` for why
      # splitting them does not work.

databases:
  - name: rendercv-web-db
    plan: free
    databaseName: rendercv_web
