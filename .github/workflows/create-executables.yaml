name: Create executables

# GitHub events that trigger the workflow:
on:
  workflow_call: # to make the workflow triggerable from other workflows
  workflow_dispatch: # to make the workflow triggerable manually

jobs:
  create_executables:
    name: For ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Create executable
        run: just create-executable

      - name: Test the executable
        shell: bash
        env:
          # Rich prints characters like ✓ that Windows' default encoding lacks:
          PYTHONIOENCODING: utf-8
        run: |
          executable="$(ls "$PWD"/bin/rendercv-* | grep -v '\.zip$')"
          mkdir executable-test
          cd executable-test
          "$executable" new "John Doe" --design moderncv --entries
          "$executable" render John_Doe_CV.yaml
          test -s rendercv_output/John_Doe_CV.pdf

      - name: Upload executable as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: rendercv-${{ matrix.os }}
          path: bin/*
