name: Publish the AI agent skill

# The skill is generated into skills/ (`just update-skill`) and mirrored to the
# rendercv/rendercv-skill repository, from which `npx skills add` installs it.
# It's published with each release, so it always describes a released version.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Mirror skills/ to rendercv/rendercv-skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rendercv/rendercv-skill
          # A deploy key with write access to rendercv/rendercv-skill:
          ssh-key: ${{ secrets.RENDERCV_SKILL_DEPLOY_KEY }}
          path: distribution

      - name: Mirror the skill
        run: |
          rm -rf distribution/skills
          mkdir -p distribution/skills
          cp -r skills/rendercv distribution/skills/
          cp skills/README.md distribution/README.md

      - name: Push the changes
        working-directory: distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update the skill from rendercv/rendercv@${GITHUB_SHA::7}"
            git push
          fi
