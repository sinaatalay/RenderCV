name: Test

# GitHub events that trigger the workflow:
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_call: # to make the workflow triggerable from other workflows
  workflow_dispatch: # to make the workflow triggerable manually

# The workflow:
jobs:
  prek:
    name: Run pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.15"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install the project
        run: just sync

      - name: Run prek
        uses: j178/prek-action@v3
        with:
          extra-args: --all-files

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Build docs
        run: just build-docs

  test:
    name: Test with Py${{ matrix.python-version }} on ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Test
        run: just test-coverage
        env:
          HYPOTHESIS_PROFILE: ci

      - name: Rename the coverage file
        run: mv .coverage .coverage.${{ matrix.python-version }}.${{ matrix.os }}

      - name: Upload coverage as an artifact
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: coverage-${{ matrix.python-version }}-${{ matrix.os }}
          path: .coverage.${{ matrix.python-version }}.${{ matrix.os }}

  docker:
    name: Render offline with Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t rendercv:test .

      - name: Render without network access or cached Typst packages
        run: |
          mkdir -p "$RUNNER_TEMP/rendercv-docker"
          cp examples/John_Doe_ClassicTheme_CV.yaml "$RUNNER_TEMP/rendercv-docker/cv.yaml"
          docker run --rm --network none \
            -v "$RUNNER_TEMP/rendercv-docker:/work" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -w /work \
            rendercv:test render cv.yaml
          test -s "$RUNNER_TEMP/rendercv-docker/rendercv_output/John_Doe_CV.pdf"

  report-coverage:
    name: Generate the coverage report
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download coverage files
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-* # download all the uploaded coverage reports
          path: coverage
          merge-multiple: true # download them in the same folder

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Combine coverage files
        run: |
          uv run --frozen coverage combine coverage
          uv run --frozen coverage report
          uv run --frozen coverage html --show-contexts --title "RenderCV coverage for ${{ github.sha }}"

      - name: Upload the coverage report to smokeshow
        run: uv tool run smokeshow==0.4.0 upload ./htmlcov
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: ${{ github.event_name != 'pull_request' && 'Coverage {coverage-percentage}' || '' }}
          SMOKESHOW_GITHUB_COVERAGE_THRESHOLD: 90
          SMOKESHOW_GITHUB_CONTEXT: coverage
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
