repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^packages/rendercv-fonts/src/rendercv_fonts/.*\.(otf|ttf)$
      - id: check-toml
  # Python tools run from the locked project environment, so uv.lock is the single
  # source of truth for their versions:
  - repo: local
    hooks:
      - id: codespell
        name: codespell
        language: system
        entry: uv run --frozen --all-extras codespell
        types: [text]
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run --frozen --all-extras ruff check --force-exclude
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --frozen --all-extras ruff format --force-exclude
        types_or: [python, pyi]
      - id: ty-check
        name: ty check
        language: system
        entry: uv run --frozen --all-extras ty check src packages tests
        pass_filenames: false
