- description: "Use the moderncv design"
  vars:
    query: "Create a simple RenderCV CV for John Doe with just a name and one skill. Use the moderncv design."
  assert:
    - type: python
      value: file://graders/rendercv_validation.py
    - type: contains
      value: "designs.moderncv("
    - type: llm-rubric
      value: |
        The response:
        - Gives a YAML file without a `design:` field
        - Gives a `design.typ` with `#let design = designs.moderncv()` (or `rendercv new ... --design moderncv`)

- description: "Custom colors and margins"
  vars:
    query: "Create a RenderCV CV for John Doe with just a name and one skill. Use dark red (#8B0000) for the name and section titles, 1-inch margins on all sides, and A4 paper. Keep the classic design."
  assert:
    - type: python
      value: file://graders/rendercv_validation.py
    - type: contains
      value: "designs.classic("
    - type: llm-rubric
      value: |
        The response includes a YAML file without a `design:` field, and a `design.typ` that:
        - Sets `colors: (name: ..., section_titles: ...)` to a dark red like `rgb("#8b0000")`
        - Sets `page: (size: "a4", ...)` with `top_margin`, `bottom_margin`, `left_margin`, and `right_margin` set to `1in`
        - Uses `designs.classic(...)`

- description: "Custom entry type"
  vars:
    query: "I want a 'talks' section where each talk has a title, an event, and a date. How do I do that in RenderCV?"
  assert:
    - type: contains
      value: "entry-type("
    - type: llm-rubric
      value: |
        The response:
        - Defines a talk entry type in `entries.typ` with `entry-type(...)` and `field(...)` for title, event, and date
        - Imports the standard entry types (e.g. `#import "@preview/rendercv:...": *`) so they stay available
        - Shows YAML entries with title, event, and date in a section
