- description: "Install command uses rendercv[full]"
  vars:
    query: "How do I install RenderCV?"
  assert:
    - type: contains
      value: "rendercv[full]"

- description: "Shared design file workflow"
  vars:
    query: "I want to reuse the same design across multiple CVs. How do I set this up?"
  assert:
    - type: contains
      value: "--design"
    - type: llm-rubric
      value: |
        The response explains:
        - The YAML files contain the content (and optionally locale/settings), never a design
        - The design is a Typst file (like `design.typ`) that defines `design`, e.g. `#let design = designs.classic(...)`
        - Use 'rendercv render cv.yaml --design path/to/design.typ' (or `settings.render_command.design`) to use it

- description: "Watch mode for live editing"
  vars:
    query: "How can I see my CV update in real-time as I edit the YAML file?"
  assert:
    - type: contains
      value: "--watch"

- description: "CLI field overrides with dot notation"
  vars:
    query: "I want to render my CV but temporarily change my name to 'Jane Smith' and try another design file, other.typ, without editing my files. How?"
  assert:
    - type: contains
      value: "--cv.name"
    - type: contains
      value: "--design other.typ"

- description: "Bold keywords in settings"
  vars:
    query: "I want RenderCV to automatically bold certain keywords in my CV: 'Python', 'Machine Learning', and 'Kubernetes'. How do I set this up?"
  assert:
    - type: contains
      value: "bold_keywords"

- description: "Upgrade a RenderCV 2 file"
  vars:
    query: "I have a CV YAML file from RenderCV 2 with a `design:` field, and RenderCV now says the design is not set in the YAML anymore. What do I do?"
  assert:
    - type: contains
      value: "rendercv migrate"
