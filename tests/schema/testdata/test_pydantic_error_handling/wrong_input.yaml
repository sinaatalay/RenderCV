# yaml-language-server: $schema=../../../../../schema.json
cv:
  name: John Doe
  website: not_a_valid_url
  phone: not_a_valid_phone_number
  email:
    - john@example.com
    - not_a_valid_email
  photo: photo_doesnt_exist.jpg
  social_networks:
    - network: LinkedIn
      username: johndoe
    - network: ORCID
      username: not_a_valid_orcid_id
    - network: Linkdin
      username: johndoe
  custom_connections:
    - placeholder: Book a call
  sections:
    no_such_entry_type:
      - does_this_entry_exist: no
    typo_in_a_field:
      - institution: Boğaziçi University
        aera: Computer Engineering
    missing_field:
      - company: Company C
        location: Can there be an experience entry without a position?
    free_text_date:
      - title: Can you provide any string as a date?
        authors:
          - Sure.
        date: "Fall 2025"
    free_text_start_date:
      - name: Free text isn't allowed in start dates.
        start_date: Fall 2025
    not_a_string:
      - name:
          date: Is this even a string?
    end_before_start:
      - company: Apple
        position: CEO
        start_date: 2025-01-01
        end_date: 2020-01-01
    authors_not_a_list:
      - title: Should authors be a list?
        authors: I'm the author!
    unknown_type:
      - type: experiense
        company: Company D
        position: Engineer
    subsections:
      first:
        - bullet: This one is fine.
      second: Not a list.
    invalid_doi:
      - title: A paper
        authors: [A]
        doi: not-a-doi
locale:
  language: english
  month_names: [January]
settings:
  current_date: todady
  render_command:
    design: design.yaml
