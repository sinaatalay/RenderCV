# The full default design of RenderCV 2's `ember` theme, as `rendercv new` wrote it.
design:
  theme: ember
  page:
    size: us-letter
    top_margin: 0.6in
    bottom_margin: 0.6in
    left_margin: 0.6in
    right_margin: 0.6in
    show_footer: true
    show_top_note: true
  colors:
    body: rgb(35, 31, 32)
    name: rgb(155, 35, 25)
    headline: rgb(90, 60, 55)
    connections: rgb(100, 75, 68)
    section_titles: rgb(155, 35, 25)
    links: rgb(155, 35, 25)
    footer: rgb(140, 125, 118)
    top_note: rgb(140, 125, 118)
  typography:
    line_spacing: 0.6em
    alignment: justified-with-no-hyphenation
    date_and_location_column_alignment: right
    font_family:
      body: Ubuntu
      name: Gentium Book Plus
      headline: Gentium Book Plus
      connections: Ubuntu
      section_titles: Ubuntu
    font_size:
      body: 10pt
      name: 30pt
      headline: 10.5pt
      connections: 9pt
      section_titles: 1.25em
    small_caps:
      name: false
      headline: true
      connections: false
      section_titles: true
    bold:
      name: true
      headline: false
      connections: false
      section_titles: false
  links:
    underline: true
    show_external_link_icon: false
  header:
    alignment: center
    photo_width: 3.5cm
    photo_position: left
    photo_space_left: 0.4cm
    photo_space_right: 0.4cm
    space_below_name: 0.5cm
    space_below_headline: 0.4cm
    space_below_connections: 0.6cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: false
      separator: ·
      space_between_connections: 0.5cm
  section_titles:
    type: centered_without_line
    line_thickness: 0.5pt
    space_above: 0.55cm
    space_below: 0.25cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 1.1em
    space_between_text_based_entries: 0.3em
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0.1cm
    space_between_columns: 0.15cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0.05cm
      space_left: 0cm
    highlights:
      bullet: ◆
      nested_bullet: ◦
      space_left: 0.15cm
      space_above: 0.05cm
      space_between_items: 0.04cm
      space_between_bullet_and_text: 0.5em
  templates:
    footer: '*NAME -- PAGE_NUMBER/TOTAL_PAGES*'
    top_note: '*LAST_UPDATED CURRENT_DATE*'
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION** -- LOCATION
        *DEGREE_WITH_AREA*
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME** -- LOCATION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **COMPANY** -- LOCATION
        *POSITION*
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
